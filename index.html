<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Convert Money</title>
</head>

<body>
    <!-- <img id="background-site" src="./assets/backgroundSite.webp"> -->

    <img id="img-logo" src="./assets/logo.ice.png" alt="img-logo">

    <main>

        <label class="text-description">
            <p>Converter <b>de</b></p>
            <select id="currency-selector-from">
                <option value="real-convert">R$ Real Brasileiro</option>
                <option value="dolar-convert">US$ Dólar americano</option>
                <option value="euro-convert">€ Euro</option>
                <option value="libra-convert">£ Libra</option>
                <option value="bitcoin-convert"> Bitcoin</option>
            </select>
        </label>

        <label class="text-description">
            <p>Converter <b>para</b></p>
            <select id="currency-selector-to">
                <option value="dolar">US$ Dólar americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="bitcoin"> Bitcoin</option>
                <option value="real">R$ Real Brasileiro</option>
            </select>
        </label>

        <label class="text-description">
            <p>Valor</p>
            <input id="input-currency" placeholder="R$ 10.000,00">
        </label>

        <button id="convert-button" >Converter</button>

        <section> 
            <div class="currency-box">
                <img id="currency-flag-convert" src="./assets/real-copy.png" alt="moeda-a-ser-convertida">
                <p class="currency" id="currency-name-convert" >Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="./assets/arrow.png" alt="seta-para-baixo">

            <div class="currency-box">
                <img id="currency-flag-converted" src="./assets/dolar-copy.png" alt="moeda-convertida">
                <p class="currency" id="currency-name-converted">Dólar americano</p>
                <p class="currency-value">US$ 0.00</p>
            </div>
        </section>



    </main>


</body>

</html>
